---
- name: Playbook to manage elnappos dotfiles (https://github.com/elnappo/dotfiles)
  hosts: localhost
  connection: local
  tasks:
    - name: load custom vars
      include_vars: ../vars.yml
      tags:
        - always

    - name: Make sure dotfiles are present
      git:
        repo: https://github.com/elnappo/dotfiles.git
        dest: ~/.dotfiles

    - name: Install oh-my-zsh
      git:
        repo: https://github.com/robbyrussell/oh-my-zsh.git
        dest: ~/.local/share/oh-my-zsh
        update: yes

    - name: Install tmux plugin manager
      git:
        repo: https://github.com/tmux-plugins/tpm.git
        dest: ~/.local/share/tpm
        update: yes

    - name: Install dein.vim
      git:
        repo: https://github.com/Shougo/dein.vim.git
        dest: ~/.local/share/dein/repos/github.com/Shougo/dein.vim
        update: yes

    - name: Create folder
      file:
        path: "{{item}}"
        state: directory
      loop:
        - "~/.cache/vim/"
        - "~/.cache/vim/backup/"
        - "~/.cache/vim/dein/"
        - "~/.cache/vim/swap/"
        - "~/.cache/vim/undo/"
        - "~/.cache/wget/"
        - "~/.config/aerospace/"
        - "~/.config/fish/"
        - "~/.config/gtk-3.0"
        - "~/.config/i3/"
        - "~/.config/i3blocks/"
        - "~/.config/karabiner/"
        - "~/.config/terminator/"
        - "~/.config/termite/"
        - "~/.config/vscode/"
        - "~/.local/share/bash/"
        - "~/.local/share/fish/"
        - "~/.local/share/zsh/"
        - "~/Coding/"
        - "~/Coding/golang/"
        - "~/Library/Application Support/Code/User/"

    - include_tasks: tasks/link_files.yml
      tags:
        - links

    - include_tasks: tasks/packages.yml
      tags:
        - packages

    # Needs to be after packages
    - include_tasks: tasks/tmux_plugins.yml
      tags:
        - tmux_plugins

    - include_tasks: tasks/shells.yml
      tags:
        - shells

    - include_tasks: tasks/macos.yml
      when: ansible_facts['os_family'] == "Darwin"
      tags:
        - macos

    - include_tasks: tasks/macos_defaults.yml
      when: ansible_facts['os_family'] == "Darwin"
      tags:
        - macos_defaults

    - include_tasks: tasks/arch.yml
      when: ansible_facts['os_family'] == "Archlinux"
      tags:
        - arch

  handlers:
    - name: Kill Dock
      command: killall Dock

    - name: Kill Finder
      command: killall Finder

    - name: Kill Transmission
      command: killall Transmission
      ignore_errors: yes

    - name: Kill Safari
      command: killall Safari
      ignore_errors: yes

    - name: Kill Terminal
      command: killall Terminal
      ignore_errors: yes
